<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 · Page introuvable — Yvo Vami Neguem</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark light; --bg: #080c0a; --fg: #eaf1ed; --dim: #a6b5ad; --accent: #fcd116; --ink: #171300; }
      @media (prefers-color-scheme: light) { :root { --bg: #f4f1e8; --fg: #15211b; --dim: #425249; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: var(--bg); color: var(--fg); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
      main { max-width: 34rem; }
      .code { font: 500 0.8rem/1 ui-monospace, Consolas, monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
      h1 { margin: 1rem 0; font-size: clamp(3rem, 12vw, 6rem); line-height: 0.95; letter-spacing: -0.05em; }
      p { margin: 0 0 2rem; color: var(--dim); line-height: 1.6; }
      a { display: inline-block; padding: 0.9rem 1.4rem; border-radius: 999px; background: var(--accent); color: var(--ink); font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" style="margin-bottom: 0">Erreur 404 · Error 404</p>
      <h1>Service introuvable.</h1>
      <p>
        Cette route n’existe pas (ou plus). Retour à l’accueil pour retrouver le portfolio.<br />
        This route doesn’t exist (anymore). Head back home to see the portfolio.
      </p>
      <a href="/">← Yvo Vami Neguem</a>
    </main>
  </body>
</html>
