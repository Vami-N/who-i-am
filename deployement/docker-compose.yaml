version: '3.8'

services:
  myselft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Myselft
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - VITE_SITE_URL=${VITE_SITE_URL:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3