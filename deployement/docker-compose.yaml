services:
  myselft:
    build:
      context: ..
      dockerfile: dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
    container_name: Myselft
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3