    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Thème & langue appliqués avant le premier rendu : pas de flash -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          root.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f4f1e8' : '#080c0a');

          var fromUrl = new URLSearchParams(location.search).get('lang');
          var stored = localStorage.getItem('lang');
          var englishRoute = /\/en\/?$/.test(location.pathname);
          var lang =
            fromUrl === 'fr' || fromUrl === 'en'
              ? fromUrl
              : englishRoute
                ? 'en'
              : stored === 'fr' || stored === 'en'
                ? stored
                : (navigator.language || 'fr').toLowerCase().indexOf('fr') === 0
                  ? 'fr'
                  : 'en';
          root.setAttribute('lang', lang);
        } catch (e) {}
      })();
    </script>

    <style>
      html { background: #080c0a; }
      html[data-theme='light'] { background: #f4f1e8; }
      body { margin: 0; }
      .boot {
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #eaf1ed;
        text-align: center;
      }
      html[data-theme='light'] .boot { color: #15211b; }
      .boot p { margin: 0 0 0.75rem; font: 500 0.8rem/1 ui-monospace, Consolas, monospace; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; }
      .boot h1 { margin: 0; font-size: clamp(2.8rem, 10vw, 6rem); line-height: 0.92; letter-spacing: -0.05em; }
      .boot em { color: #fcd116; }
      html[data-theme='light'] .boot em { color: #0b6b4d; }
      html[lang='fr'] .boot [lang='en'], html[lang='en'] .boot [lang='fr'] { display: none; }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot">
        <div>
          <p><span lang="fr">Ingénieur logiciel full-stack</span><span lang="en">Full-stack software engineer</span></p>
          <h1>Yvo Vami<br />Neguem<em>.</em></h1>
        </div>

    <noscript>

    <script type="module" src="/src/main.tsx"></script>
